# Netlify: build the React app in app/ and publish app/dist.
# Netlify's own Git builds are turned off; the GitHub Actions deploy publishes the same directory.
[build]
  base = "app"
  publish = "dist"
  command = "npm ci && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirects live in app/public/_redirects (copied to dist). Keep them out of this file:
# Netlify merges _redirects before netlify.toml, and a duplicate /api/demo rule here
# would move behind the SPA catch-all, so requests would get index.html instead of the
# function.
