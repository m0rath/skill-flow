# Netlify: build the React app in app/ and publish app/dist.
# Netlify's own Git builds are turned off; the GitHub Actions deploy publishes the same directory.
[build]
  base = "app"
  publish = "dist"
  command = "npm ci && npm run build"

[[redirects]]
  from = "/skill-flow-mapper"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/skill-flow-mapper/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-flow-mapper"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-flow-mapper/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/skill-flow"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/skill-flow/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-flow"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-flow/*"
  to = "/index.html"
  status = 200
