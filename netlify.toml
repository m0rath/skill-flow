# Netlify: static site, no build step. Headers live in public/_headers.
[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/skill-flow-mapper"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/skill-flow-mapper/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-flow-mapper"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-flow-mapper/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/skill-flow"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/skill-flow/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-flow"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-flow/*"
  to = "/index.html"
  status = 200