name: CI

on:
  push:
    branches: [main, devlop]
  pull_request:
  # Also run by the Netlify deploy workflow before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # Original vanilla app in public/, kept as a reference.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # React app in app/ — this is what gets deployed.
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run format:check
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
