name: CI

on:
  push:
    branches: [main, devlop]
  pull_request:
  # Also run by the Netlify deploy workflow before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run build
        working-directory: app
